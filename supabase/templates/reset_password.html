<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Reset your GatePass password</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Reset your GatePass password</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0d0d0d;">
        <tr>
          <td style="padding:0 4px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding-right:8px;vertical-align:middle;"><img src="https://gatepass.so/email/gatepass-mark.png" width="28" height="28" alt="GatePass" style="display:block;border:0;border-radius:7px;"></td>
                <td style="vertical-align:middle;font-size:18px;font-weight:600;letter-spacing:-0.03em;color:#0d0d0d;">GatePass</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background-color:#ffffff;border-radius:28px;padding:36px 28px;">
            <p style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#8a8a8a;">Account</p>
            <h1 style="margin:12px 0 0;font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-0.04em;">Reset your password.</h1>
            <p style="margin:12px 0 0;font-size:15px;line-height:24px;color:#555555;">Use the button below to choose a new password. The link works once and expires soon.</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:28px;">
              <tr>
                <td align="center" style="border-radius:999px;background-color:#0d0d0d;">
                  <a href="{{ .ConfirmationURL }}" target="_blank" style="display:block;padding:16px 24px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:999px;">Choose a new password</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 4px 0;font-size:12px;line-height:20px;color:#8a8a8a;">
            Didn&rsquo;t ask for this? You can ignore this email and your password stays the same.<br>
            &copy; GatePass &middot; Accra, Ghana
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
